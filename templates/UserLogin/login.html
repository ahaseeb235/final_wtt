{% load static %}
{% load crispy_forms_tags %}





<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>

<body>





    <div class="container-fluid">
        <div class="row">
            <!-- Left Column: Form -->
            <div class="col-md-6 center-content half-height">
                <div class="container bg-light shadow-md p-5 form-layout">
                    <div class="text-center">
                        <h3>Login here</h3>
                    </div>
                    <br>
                    <form method="POST" action="" autocomplete="off">
                        {% csrf_token %}
                        {{ form.username|as_crispy_field }}
                        <br>
                        {{ form.password|as_crispy_field }}
                        <br>
                        <br>
                        <button type="submit" class="btn btn-success w-100">Sign in</button>
                    </form>
                    <br>

                    <div class="text-center">
                        <p>Don't have an account yet? <a href="{% url 'register' %}">Register here!</a></p>
                    </div>
                </div>
            </div>

            <!-- Right Column: Image -->
            <div class="col-md-6 image-column full-height">

                <!-- Image is set as a background in the CSS -->
            </div>
        </div>
    </div>



    <!-- scripts -->
    <!-- <script src="{% static 'js/script.js' %}"></script> -->
    <!-- <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
</body>

</html>
