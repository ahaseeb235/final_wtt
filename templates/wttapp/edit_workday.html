{% extends "base.html" %}
{% load static %}
{% block title %} wttApp - Edit/Update Workday record {% endblock %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-2 mb-2">
    <div class="row">
        <h4>Update your Workday record</h4>

        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a href="{% url 'home' %}" class="btn btn-secondary">Cancel</a>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
