{% extends 'base.html' %}
{% load static %}
{%load crispy_forms_tags%}

{% block title %} wttApp - Create Workday {% endblock %}



{% block content %}


<div class="container">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header">
                    <h3> Create Workday </h3>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="{% url 'home' %}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function autoFillTime() {
            var workdayType = document.getElementById("id_workday_type").value;
            var timeInField = document.getElementById("id_time_in");
            var timeOutField = document.getElementById("id_time_out");
    
            if (workdayType === "Sick Leave" || workdayType === "Bank Holiday") {
                timeInField.value = "09:00";  // Set to 9:00 AM
                timeOutField.value = "17:00"; // Set to 5:00 PM
            } else {
                timeInField.value = "";
                timeOutField.value = "";
            }
        }
    
        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById("id_workday_type").addEventListener("change", autoFillTime);
        });
    </script>

{% endblock %}
