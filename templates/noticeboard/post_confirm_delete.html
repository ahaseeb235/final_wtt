{% extends 'base.html' %}

{% block content %}
<h3 class="text-danger">Are you sure you want to delete this post?</h3>
<p class="mt-5">{{ post.title }}</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'noticeboard:post_detail' pk=post.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
