{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<h3>{{ title }}</h3>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-sm btn-primary">Save</button>
    <a href="{% url 'noticeboard:post_list' %}" class="btn btn-sm btn-secondary">Cancel</a>
</form>
{% endblock %}
